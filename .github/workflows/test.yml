name: test

# Each commit runs once: a pull request's commits through pull_request,
# master through push. A newer push to a pull request cancels its older
# run; master's runs are never cancelled. As vtep4r's.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The interop tier: bfdd4r against FRR's bfdd and BIRD, natively, in
  # network namespaces, over IPv4 and IPv6. Root. BFD4R_REQUIRE_FRR and
  # BFD4R_REQUIRE_BIRD make a run that cannot start them fail rather
  # than omit.
  interop:
    name: interop (root, FRR and BIRD)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq frr bird2 iproute2
      # Ubuntu 26.04 enforces an AppArmor profile for bfdd that allows only
      # FRR's default paths, so bfdd cannot write its pid file under the
      # lab's pathspace. The runner is thrown away after the job. As
      # ospfv2's CI does for ospfd and isis's for isisd.
      - name: Unload the bfdd AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/bfdd ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bfdd
            echo "bfdd profile unloaded"
          fi
          sudo grep '^bfdd ' /sys/kernel/security/apparmor/profiles || echo "bfdd not confined"
      - name: Interop tests, as root
        run: sudo env "PATH=$PATH" BFD4R_REQUIRE_FRR=1 BFD4R_REQUIRE_BIRD=1 bundle exec ruby -I. test/interop/interop_test.rb
      - name: The fault matrix, as root
        run: sudo env "PATH=$PATH" BFD4R_REQUIRE_FRR=1 BFD4R_REQUIRE_BIRD=1 bundle exec ruby -I. test/interop/fault_matrix_test.rb

  ruby:
    name: ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Quote versions: unquoted, YAML reads 4.0 as the number 4.
        ruby: ['3.3', '3.4', '4.0']
        experimental: [false]
        include:
          - ruby: head
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Unit tests
        run: bundle exec ruby test/run_unit.rb
      - name: Unit tests with frozen string literals
        # Catches code that mutates a string literal before Ruby freezes them.
        run: bundle exec ruby --enable-frozen-string-literal test/run_unit.rb
      - name: Functional tests (sessions, behaviours and faults on a manual clock)
        run: bundle exec ruby test/run_functional.rb
        timeout-minutes: 2
